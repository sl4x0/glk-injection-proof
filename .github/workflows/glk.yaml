name: GLK PR Workflow (repro)

on:
  workflow_call:

jobs:
  glk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Commit and push changes
      env:
        MY_SECRET: ${{ secrets.MY_SECRET }}
      run: |
        echo "whoami:"
        whoami
        echo "rendered-and-executed-line:"
        echo "would-push-to:HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
